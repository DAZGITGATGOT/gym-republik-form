name: Deploy Worker

on:
  push:
    branches: [main]
    paths: [worker/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.GHL_TOKEN }}" | npx wrangler secret put GHL_TOKEN
          echo "${{ secrets.GHL_LOCATION_ID }}" | npx wrangler secret put GHL_LOCATION_ID
          echo "${{ secrets.GHL_PIPELINE_ID }}" | npx wrangler secret put GHL_PIPELINE_ID
          echo "${{ secrets.GHL_STAGE_ID }}" | npx wrangler secret put GHL_STAGE_ID
          echo '${{ secrets.GHL_CF_IDS }}' | npx wrangler secret put GHL_CF_IDS
